# CI — תכנית 100 השלבים: שערי איכות מתמשכים (שלב 8; יורחב בשלבים הבאים לפי נספח ו)
# כלל: אין עדכון golden אוטומטי; שתי ריצות של אותו job מניבות אותן תוצאות.
name: CI — תכנית 100 השלבים

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plan-gates:
    name: שערי התכנית (build, typecheck, lint, תלות, מאמתי הגירה)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # נדרש לבדיקת 'הקוד הישן לא נערך' (היסטוריה מלאה)

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci (מה־lockfile בלבד)
        run: npm ci

      - name: בניית החבילות
        run: npm run build:packages

      - name: בדיקת טיפוסים
        run: npm run typecheck:packages

      - name: בדיקת טיפוסים — קוד מעטפת חדש (src/worker-host, src/renderers, tests)
        run: npx tsc --noEmit

      - name: lint חבילות (איסור DOM/Node בליבה)
        run: npm run lint:packages

      - name: גבולות תלות (dependency-cruiser)
        run: npm run deps:check

      - name: בדיקה שלילית — הפרת גבול נתפסת אוטומטית
        run: node scripts/migration/verify-dependency-rules.mjs

      - name: בדיקות יחידה של החבילות (יחידות, גיבוב, spans, atoms, inline/blocks, פרסר, Unicode, סוגריים)
        # סבב י"ג (תיקון אי-היציבות מסבב ט'): הסוויטה רצה פעם אחת כאן — כולל נעילת
        # המונה המדויק; המאמתים מדלגים על ריצות הבת הכפולות (TORA_SKIP_TEST_REGRESSION)
        # שקרסו את ה-job מלחץ משאבים (26 ריצות מלאות ברצף).
        env:
          TORA_SKIP_TEST_REGRESSION: "1"
        run: |
          # NO_COLOR + הסרת ANSI כפולה (שיעור סבב ה': chalk/vitest מצבעים גם בלי TTY תחת CI=true)
          NO_COLOR=1 npm run test:packages > /tmp/testout.raw 2>&1 || { cat /tmp/testout.raw; exit 1; }
          sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' -e 's/\x1b\][^\x07]*\x07//g' /tmp/testout.raw > /tmp/testout.log
          grep -qE "Tests[[:space:]]+1033[[:space:]]+passed" /tmp/testout.log || { tail -5 /tmp/testout.log; echo "צפוי בדיוק 1033 בדיקות"; exit 1; }
          node scripts/migration/verify-units.mjs
          node scripts/migration/verify-canonical-hash.mjs
          node scripts/migration/verify-error-catalog.mjs
          node scripts/migration/verify-fixtures-schema.mjs
          node scripts/migration/verify-spans.mjs
          node scripts/migration/verify-atoms.mjs
          node scripts/migration/verify-inline-blocks.mjs
          node scripts/migration/verify-parser.mjs
          node scripts/migration/verify-unicode.mjs
          node scripts/migration/verify-brackets.mjs
          node scripts/migration/verify-notes.mjs
          node scripts/migration/verify-text-audit.mjs
          node scripts/migration/verify-measurement-api.mjs
          node scripts/migration/verify-fonts-manifest.mjs
          node scripts/migration/verify-harfbuzz-provider.mjs
          node scripts/migration/verify-enforcement.mjs
          node scripts/migration/verify-shaping-cache.mjs
          node scripts/migration/verify-uax14.mjs
          node scripts/migration/verify-bidi.mjs
          node scripts/migration/verify-cross-host.mjs
          node scripts/migration/verify-settings-schema.mjs
          node scripts/migration/verify-layout-ir.mjs
          node scripts/migration/verify-typeset-contract.mjs
          node scripts/migration/verify-layout-engine.mjs
          node scripts/migration/verify-line-candidates.mjs
          node scripts/migration/verify-paragraph-dp.mjs
          node scripts/migration/verify-quality-comparator.mjs
          node scripts/migration/verify-emergency-policy.mjs
          node scripts/migration/verify-paragraph-end.mjs
          node scripts/migration/verify-line-battery.mjs
          node scripts/migration/verify-next-path.mjs
          node scripts/migration/verify-pagination-state.mjs
          node scripts/migration/verify-page-templates.mjs
          node scripts/migration/verify-page-search.mjs
          node scripts/migration/verify-page-candidates.mjs
          node scripts/migration/verify-note-reservation.mjs
          node scripts/migration/verify-sidenotes.mjs
          node scripts/migration/verify-endnotes.mjs
          node scripts/migration/verify-h3-barrier.mjs
          node scripts/migration/verify-m6-gate.mjs
          node scripts/migration/verify-policy-torah.mjs
          node scripts/migration/verify-h0-opener.mjs
          node scripts/migration/verify-h1-shaar.mjs
          node scripts/migration/verify-h2-opener.mjs
          node scripts/migration/verify-h3-policy.mjs
          node scripts/migration/verify-h456-escort.mjs
          node scripts/migration/verify-firstword.mjs
          node scripts/migration/verify-brackets-crosspage.mjs
          node scripts/migration/verify-balance-chapter.mjs
          node scripts/migration/verify-m7-gate.mjs
          node scripts/migration/verify-ornament-space.mjs
          node scripts/migration/verify-anchor-toc.mjs
          node scripts/migration/verify-fixed-point.mjs
          node scripts/migration/verify-links.mjs
          node scripts/migration/verify-differential-lines.mjs
          node scripts/migration/verify-render-html.mjs
          node scripts/migration/verify-cli.mjs
          node scripts/migration/verify-worker-host.mjs
          node scripts/migration/verify-preview.mjs
          node scripts/migration/verify-layout-audit.mjs
          node scripts/migration/verify-e2e-skeleton.mjs
          node scripts/migration/verify-engine-flag.mjs

      - name: מאמתי הגירה — מקורות, מלאי, בייסליין, fixtures, parity
        env:
          TORA_SKIP_TEST_REGRESSION: "1"
        run: |
          node scripts/migration/verify-source-manifest.mjs
          node scripts/migration/verify-transfer-inventory.mjs
          node scripts/migration/verify-assets.mjs
          node scripts/migration/verify-baseline-run.mjs
          node scripts/migration/verify-test-fixtures.mjs
          node scripts/migration/verify-parity-matrix.mjs
          node scripts/migration/verify-compatibility.mjs

      - name: פרסום artifacts שלד המהלך (manifest/ledger/audit — שלב 39)
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reference-artifacts
          path: artifacts/e2e-reference/
          retention-days: 30

      - name: שלד workspaces + מוסכנות עבודה (כולל הקוד הישן לא נערך)
        env:
          TORA_SKIP_TEST_REGRESSION: "1"
        run: |
          node scripts/migration/verify-workspaces.mjs
          node scripts/migration/verify-work-conventions.mjs
